<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" fill="none" />
  
  <!-- Activity / Pulse Heartbeat Wave Line -->
  <path 
    d="M14 33h8l4-9 6 19 6-13 4 5h12" 
    stroke="url(#pulseGrad)" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  
  <!-- Glowing Green Active Bridge Dot -->
  <circle cx="50" cy="18" r="3.5" fill="#10B981" />
  <circle cx="50" cy="18" r="5.5" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
</svg>